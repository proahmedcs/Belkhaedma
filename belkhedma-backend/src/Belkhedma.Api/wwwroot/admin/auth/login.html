<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Belkhedma Admin Login</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #102a43;
      --muted: #5c6f82;
      --primary: #0f766e;
      --border: #d8e1eb;
      --danger: #b42318;
    }
    * { box-sizing: border-box; font-family: Inter, "Segoe UI", Tahoma, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    .shell { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 4px 16px rgba(16, 42, 67, 0.08);
    }
    h1 { margin: 0 0 6px; font-size: 24px; }
    p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
    label { display: block; margin: 10px 0 6px; color: var(--muted); font-size: 13px; }
    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
      color: var(--text);
      background: #fff;
    }
    button {
      margin-top: 14px;
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 11px;
      font-weight: 700;
      font-size: 14px;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
    }
    .status { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 18px; }
    .status.error { color: var(--danger); }
    .hint {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      border: 1px dashed var(--border);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      background: #fafcff;
    }
    code { background: #eef2f7; padding: 1px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card">
      <h1>Admin Sign In</h1>
      <p>Use your admin account to access the dashboard.</p>

      <form id="loginForm">
        <label for="userName">Username</label>
        <input id="userName" type="text" autocomplete="username" required />

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required />

        <button type="submit">Sign In</button>
      </form>

      <div class="status" id="status"></div>
      <div class="hint">
        Default seed admin (development):<br />
        <code>admin</code> / <code>Admin#12345</code>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const statusEl = document.getElementById("status");
    const userNameEl = document.getElementById("userName");
    const passwordEl = document.getElementById("password");

    async function ensureAnonymousOnly() {
      try {
        const response = await fetch("/api/admin-auth/me", { credentials: "include" });
        if (response.ok) {
          window.location.href = "/admin/";
        }
      } catch {
        // Ignore errors and keep login page visible.
      }
    }

    function setStatus(message, isError = false) {
      statusEl.textContent = message || "";
      statusEl.className = isError ? "status error" : "status";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      setStatus("Signing in...");

      try {
        const response = await fetch("/api/admin-auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({
            userName: userNameEl.value.trim(),
            password: passwordEl.value
          })
        });

        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload?.message || "Login failed.");
        }

        setStatus("Login successful. Redirecting...");
        window.location.href = "/admin/";
      } catch (error) {
        setStatus(error?.message || "Login failed.", true);
      }
    });

    ensureAnonymousOnly();
  </script>
</body>
</html>
